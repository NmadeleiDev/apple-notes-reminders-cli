name: Bug report
description: Report a reproducible defect without including personal Notes or Reminders data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic data. Report security issues through the private security advisory flow instead.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands and synthetic inputs that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
