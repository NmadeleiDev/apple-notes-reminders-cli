name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Verify resolved dependencies
        run: swift package resolve

      - name: Check formatting
        run: swift format lint --recursive --strict Sources ContractTests Tests Package.swift

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Run dependency-free contract tests
        run: swift run ContractTests

      - name: Validate release metadata and skill
        run: scripts/check.sh

      - name: Build and verify universal release archive
        run: scripts/package.sh 0.1.2 "$RUNNER_TEMP/release"
